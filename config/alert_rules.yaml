alerts:
  - name: HighResponseLatency
    severity: page
    condition: p95_latency > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack-oncall
    owner: "@team-platform"
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: page
    condition: error_rate > 5%
    duration: 3m
    type: symptom-based
    channel: slack-oncall
    owner: "@team-ai"
    runbook: docs/alerts.md#alert-2
  - name: CostSpike
    severity: ticket
    condition: cost_usd_per_minute > 2.5
    duration: 10m
    type: symptom-based
    channel: slack-finops
    owner: "@team-finops"
    runbook: docs/alerts.md#alert-3
